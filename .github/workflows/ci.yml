name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pi-bench validate evals/planning/sample.jsonl
      - run: pi-bench validate evals/coding/sample.jsonl
      - run: pi-bench versions
      - run: docker build -t pi-agent-bench-sandbox:ci -f docker/Dockerfile .
      - run: |
          test "$(docker run --rm pi-agent-bench-sandbox:ci pi --version)" = "0.82.1"
