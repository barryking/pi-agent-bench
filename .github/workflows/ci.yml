name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: scripts/check-all.sh
      - run: |
          sandbox_image="$(python -c 'from pi_agent_bench.versions import SANDBOX_IMAGE; print(SANDBOX_IMAGE)')"
          pi_version="$(python -c 'from pi_agent_bench.versions import PI_VERSION; print(PI_VERSION)')"
          test "$(docker run --rm "$sandbox_image" pi --version)" = "$pi_version"
