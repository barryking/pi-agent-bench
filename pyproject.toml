[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent-bench"
version = "0.3.0"
description = "Evaluate coding-agent workflows across local and hosted language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai==0.3.249",
  "openai==2.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]
[project.scripts]
pi-bench = "pi_agent_bench.cli:main"

[project.entry-points.inspect_ai]
pi_agent_bench = "pi_agent_bench.inspect_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_agent_bench = ["viewer/*.css", "viewer/*.html", "viewer/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15
